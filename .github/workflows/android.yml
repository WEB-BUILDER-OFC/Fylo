name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install required Android SDK components
        run: |
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Grant gradlew execute permission
        working-directory: fylo-android
        run: chmod +x gradlew

      - name: Fetch local PDF libraries (PDF.js + PDF-Lib)
        working-directory: fylo-android
        run: ./gradlew fetchPdfLibs --no-daemon

      - name: Use your own signing key (only if the FYLO_KEYSTORE_B64 secret is set)
        working-directory: fylo-android
        env:
          KS_B64: ${{ secrets.FYLO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.FYLO_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.FYLO_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.FYLO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ../fylo-ci-key.jks
            printf 'storeFile=../fylo-ci-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "${KS_KEYPASS:-$KS_PASS}" > keystore.properties
            echo "Signing with the key from repository secrets"
          else
            echo "No signing secret set - using the committed fylo-signing.keystore (same key on every run)"
          fi

      - name: Build debug APK
        working-directory: fylo-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK=fylo-android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"; exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK OK: $SIZE bytes"
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "APK_SIZE=$SIZE" >> $GITHUB_ENV

      - name: Verify APK version metadata and packaged web assets
        working-directory: fylo-android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          bash ./scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect APK contents (web assets check)
        run: |
          APK=fylo-android/app/build/outputs/apk/debug/app-debug.apk
          echo "=== Web assets in APK ==="
          unzip -l "$APK" | grep "assets/www" | head -30
          echo "=== PDF libs in APK ==="
          unzip -l "$APK" | grep "assets/libs" || echo "WARNING: no libs found"

      - name: Write APK identity report (evidence for update problems)
        if: always()
        working-directory: fylo-android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          R=app/build/outputs/apk/debug/apk-report.txt
          {
            echo "# FYLO APK identity report ($(date -u +%FT%TZ)) commit ${GITHUB_SHA}"
            echo "## file"; sha256sum "$APK"; ls -l "$APK"
            echo "## aapt badging (package / versionCode / sdk / abi)"
            "$BT/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|^application-debuggable|testOnly|^uses-permission" || true
            echo "## apksigner verify -v --print-certs (exit code follows)"
            "$BT/apksigner" verify -v --print-certs "$APK" 2>&1; echo "apksigner exit code: $?"
            echo "## keytool -printcert -jarfile (v1 signature)"
            keytool -printcert -jarfile "$APK" 2>&1 | grep -E "Owner|SHA256|Valid|Signature algorithm" || echo "(no v1 signature / unreadable)"
            echo "## zipalign check"; "$BT/zipalign" -c -v 4 "$APK" 2>&1 | tail -2
            echo "## expected committed-key fingerprint"; cat signing/expected-cert-sha256.txt
            echo "## signing mode"; if [ -f keystore.properties ]; then echo "keystore.properties present (YOUR key from secrets)"; else echo "committed fylo-signing.keystore"; fi
          } > "$R" 2>&1 || true
          cat "$R"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fylo-debug-apk
          path: |
            fylo-android/app/build/outputs/apk/debug/app-debug.apk
            fylo-android/app/build/outputs/apk/debug/apk-report.txt
          if-no-files-found: error
          retention-days: 30
