plugins {
    id 'com.android.application'
}

// ─── Version: ONE source of truth ─────────────────────────────────────────────
// APP_VERSION in fylo-web/core/constants.js ("MAJOR.MINOR.PATCH") drives versionName AND versionCode, so the
// native version, the web version shown in Settings, and the service-worker cache name can never drift apart.
//   versionCode = MAJOR*10000 + MINOR*100 + PATCH   (2.1.0 -> 20100)  — strictly increases with every release
// Android only treats an APK as an update when versionCode is higher than the installed one, so BUMP
// APP_VERSION for every release you hand to someone who already has FYLO installed.
// (Override for CI with -PfyloVersionCode=<int> if you need a build number inside one version.)
def readFyloVersion() {
    def f = new File(rootDir, '../fylo-web/core/constants.js')
    def m = (f.text =~ /APP_VERSION\s*=\s*'(\d+)\.(\d+)\.(\d+)'/)
    if (!m.find()) throw new GradleException("Cannot read APP_VERSION from ${f}")
    def code = m.group(1).toInteger() * 10000 + m.group(2).toInteger() * 100 + m.group(3).toInteger()
    return [name: "${m.group(1)}.${m.group(2)}.${m.group(3)}".toString(), code: code]
}
def fyloVersion = readFyloVersion()
def fyloVersionCode = (project.findProperty('fyloVersionCode') ?: fyloVersion.code).toString().toInteger()

// ─── Optional stable signing key ──────────────────────────────────────────────
// Android refuses to install an update signed with a DIFFERENT key than the installed app. With no
// keystore.properties the default debug key (~/.android/debug.keystore) is used exactly as before.
// To make updates work across machines / CI, create fylo-android/keystore.properties (git-ignored):
//   storeFile=../fylo-release.jks   storePassword=...   keyAlias=...   keyPassword=...
def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'com.fylo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.fylo.app"
        minSdk 26          // Android 8.0 — modern WebView, IndexedDB, ES modules
        targetSdk 34
        versionCode fyloVersionCode
        versionName fyloVersion.name
    }

    signingConfigs {
        if (ksFile.exists()) {
            create('fylo') {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"      // keep: changing the id would install as a NEW app and strand user data
            if (ksFile.exists()) signingConfig signingConfigs.fylo
        }
        release {
            if (ksFile.exists()) signingConfig signingConfigs.fylo
            minifyEnabled false   // Web assets are already optimised; no need to minify Java
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true   // Required: generates BuildConfig class (BuildConfig.DEBUG etc.)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Treat assets/www/** as normal assets — do not compress JS/CSS
    aaptOptions {
        noCompress 'js', 'css', 'html', 'json', 'map', 'ttf', 'otf'
    }
}

dependencies {
    // Pure Java project — WebView is built into Android.
    // AppCompat for Activity base class, window insets, and splash screen.
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // WebViewAssetLoader — serves bundled web assets over https://appassets.*
    // so that ES modules, IndexedDB, and modern web APIs work correctly.
    // (type="module" scripts are blocked on file:// in Android WebView.)
    implementation 'androidx.webkit:webkit:1.8.0'
}

// ─── Kotlin stdlib version alignment ─────────────────────────────────────────
// Kotlin 1.8+ merges stdlib-jdk7 and stdlib-jdk8 into stdlib.
// Without this, older transitive deps can bring in the old split variants
// alongside the new unified stdlib, causing checkDebugDuplicateClasses to fail.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

// ─── Sync web assets from ../../fylo-web into assets/www ──────────────────────
// Run:  ./gradlew syncWebAssets
// Then: ./gradlew assembleDebug
//
// This copies the web project into Android assets so the app ships a local copy.
// The web project lives at ../../fylo-web (two levels up from app/ module directory:
//   fylo-android/app/ → fylo-android/ → fylo/ → fylo-web/)
task syncWebAssets(type: Sync) {
    description = 'Copies FYLO web assets into Android assets/www'
    from('../../fylo-web') {
        include 'index.html'
        include 'app.js'
        include 'manifest.json'
        include 'sw.js'
        include 'core/**/*.js'
        include 'features/**/*.js'
        include 'assets/css/**'
        include 'assets/icons/**'
        include 'assets/libs/**'      // local PDF.js/PDF-Lib (downloaded by fetchLibs)
    }
    into 'src/main/assets/www'
    // Sync (not Copy) deletes files that no longer exist in fylo-web, so a removed/renamed web file can never
    // linger inside the APK. The PDF libraries are downloaded straight into www/assets/libs, so keep them.
    preserve {
        include 'assets/libs/**'
    }
}

// ─── Download PDF libraries locally (run once before building) ────────────────
// Run: ./gradlew fetchPdfLibs
// Downloads PDF.js and PDF-Lib into assets/www/assets/libs/
// These are then bundled into the APK and served from file:///android_asset/
task fetchPdfLibs(type: Exec) {
    description = 'Downloads PDF.js and PDF-Lib into assets/libs for offline bundling'
    commandLine 'bash', '-c', """
        LIBS=src/main/assets/www/assets/libs
        PDFJS=3.11.174
        PDFLIB=1.17.1
        mkdir -p "\$LIBS"
        echo "Downloading PDF.js \$PDFJS..."
        curl -fL "https://cdn.jsdelivr.net/npm/pdfjs-dist@\$PDFJS/build/pdf.min.js" \\
             -o "\$LIBS/pdf.min.js"
        curl -fL "https://cdn.jsdelivr.net/npm/pdfjs-dist@\$PDFJS/build/pdf.worker.min.js" \\
             -o "\$LIBS/pdf.worker.min.js"
        echo "Downloading PDF-Lib \$PDFLIB..."
        curl -fL "https://cdn.jsdelivr.net/npm/pdf-lib@\$PDFLIB/dist/pdf-lib.min.js" \\
             -o "\$LIBS/pdf-lib.min.js"
        echo "Done. Libraries saved to \$LIBS/"
    """
}

// Ensure web assets are synced before assembling
preBuild.dependsOn syncWebAssets

// Fail the build loudly if the packaged web app is not the same version as the native app.
task verifyWebVersion {
    description = 'Fails if assets/www is not in step with APP_VERSION'
    dependsOn syncWebAssets
    doLast {
        def packaged = file('src/main/assets/www/core/constants.js').text
        if (!(packaged =~ /APP_VERSION\s*=\s*'${java.util.regex.Pattern.quote(fyloVersion.name)}'/)) {
            throw new GradleException("assets/www/core/constants.js is not APP_VERSION ${fyloVersion.name}")
        }
        println "FYLO ${fyloVersion.name} (versionCode ${fyloVersionCode}) — web assets in step"
    }
}
preBuild.dependsOn verifyWebVersion
